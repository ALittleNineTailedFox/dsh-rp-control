# dsh-rp-control 的 bundle patch。
#
# 1) 挂载插件本体。
# 2) 声明一个插件自带的 agent preset「RP 扮演」(id: rp, order: 6)。
#
# preset 的 plugins 逐行照抄内置 standard preset —— 即
# @deepseek-ai/dsh-web-app/presets/standard.patch.yml 里 persona 行到
# tool-plugin-manager 行的完整工具栈，只做三处取舍，改动点都在下面就地注明：
#   a) persona 行改成 `prefix: {{rp_control_prompt}}` + `complete: true` +
#      `includeRuntimeContext: false`；
#   b) 删掉 agent-instructions、skill-filesystem、tool-skill；
#   c) 删掉 planning 整组。
#
# 于是这个 preset 的系统提示词内容 = 变量 rp_control_prompt 的值
# = rp-control 当前会话启用项的渲染结果（插件没启用任何模块时是
# RP_PROMPT_FALLBACK，绝不为空 —— complete 段渲染成空会清空整条系统提示词）。
#
# `disabled: !!js ...` 这类表达式、各组的 isolate 与 config 都原样保留，
# 不要手改成字符串 —— 它们是 standard preset 工具栈语义的一部分。
- insert:
    - id: rp-control
      name: dsh-rp-control
    - id: preset-rp
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: rp
        name: RP 扮演
        order: 6
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: '{{rp_control_prompt}}'
              complete: true
              includeRuntimeContext: false
          # ⚠️ 相对 standard 删掉了 `agent-instructions` 行。
          # AGENTS.md 一类指令走的是 `agent/pre-step` 消息通道（作为消息追加进对话），
          # 不是 prompt section —— 下面 persona 段的 `complete: true` 只管「唯一的
          # 系统提示词段」，对消息通道无能为力；留着它只会让 RP 会话凭空多出工程指令。
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'
          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'
          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'
          # ⚠️ 相对 standard 删掉了 `skill-filesystem` + `tool-skill` 两行。
          # skill catalog 与 agent-instructions 同属 `agent/pre-step` 消息通道，
          # 同样不是 prompt section，`complete: true` 挡不住它；
          # 否则 RP 会话里会多出一份与扮演无关的技能清单。
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'
          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'
          # ⚠️ 相对 standard 删掉了 `planning` 整组（plan-mode + isolate.planMode）。
          # 它注册的 `plan:policy` 段会被 `complete: true` 的 persona 段遮蔽：
          # complete 段成为本次组装的唯一系统提示词段，plan mode 的规则根本进不去，
          # 模式表面存在却静默失效，比没有更容易误事。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'
              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'
              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'
              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'
              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed
              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn
              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'
              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                disabled: true
                config:
                  subagentProvider: spawn
                  maxRounds: 64
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
          - id: tool-plugin-manager
            name: '@deepseek-ai/dsh-plugin-manager/tools'
            disabled: true
